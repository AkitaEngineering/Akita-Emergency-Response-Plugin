[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akita-emergency-response"
version = "1.1.0"
description = "Host-side emergency alerting for Meshtastic response teams"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "GPL-3.0-or-later"
authors = [{ name = "Akita Engineering" }]
maintainers = [
    { name = "Akita Engineering", email = "support@akitaengineering.com" },
]
keywords = ["meshtastic", "emergency-response", "search-and-rescue", "lora"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "meshtastic>=2.7,<3",
    "pypubsub>=4.0.3,<5",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2,<6"]

[project.scripts]
aerp = "aerp.cli:main"
aerp-gui = "aerp.gui:main"

[project.urls]
Homepage = "https://www.akitaengineering.com"
Repository = "https://github.com/AkitaEngineering/Akita-Emergency-Response-Plugin"

[tool.setuptools.packages.find]
include = ["aerp*"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
